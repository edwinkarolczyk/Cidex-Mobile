name: Build demo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org pl.cidex --project-name cidex_mobile .

      - name: Apply CIDEX Mobile sources
        run: |
          cp template/main.dart lib/main.dart
          cp template/pubspec.yaml pubspec.yaml

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Cidex_Mobile_demo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cidex-Mobile-demo-apk
          path: Cidex_Mobile_demo.apk
          if-no-files-found: error
