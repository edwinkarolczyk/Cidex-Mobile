name: Build WMM APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org pl.cidex --project-name cidex_mobile .

      - name: Apply WMM sources
        run: |
          python scripts/apply_sources.py
          python scripts/apply_wmm_login.py
          python scripts/patch_android.py

      - name: Add secure storage
        run: flutter pub add flutter_secure_storage

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/main.dart test/widget_test.dart

      - name: Test
        run: flutter test test/widget_test.dart

      - name: Build release APK ARM64
        run: flutter build apk --release --target-platform android-arm64 --build-name 0.5.4 --build-number 54

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk WMM.apk

      - name: Show APK size
        run: ls -lh WMM.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMM-apk
          path: WMM.apk
          if-no-files-found: error
