# WMM 0.5.21
name: Build WMM APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org pl.cidex --project-name cidex_mobile .

      - name: Apply WMM sources
        run: |
          python scripts/apply_sources.py
          python scripts/apply_wmm_login.py
          python scripts/patch_android.py
          python scripts/apply_beta.py
          python scripts/apply_stability.py
          python scripts/apply_stability_finalize.py
          python scripts/apply_wmm_status_navigation.py
          python scripts/apply_updater.py
          python scripts/apply_updater_finalize.py
          python scripts/apply_biometrics.py
          python scripts/apply_biometrics_finalize.py
          python scripts/apply_updater_resilient.py
          python scripts/apply_home_update_banner.py
          python scripts/apply_unified_qr.py
          python scripts/apply_startup_update_check.py
          python scripts/apply_dispositions.py
          python scripts/apply_warehouse.py
          python scripts/apply_warehouse_finalize.py
          python scripts/apply_warehouse_bars.py
          python scripts/apply_machine_quick_actions.py
          python scripts/apply_machine_quick_actions_finalize.py
          python scripts/apply_cycle_review_action.py
          python scripts/apply_cycle_review_finalize.py
          python scripts/apply_planned_review_finalize.py

      - name: Prepare stable release signing
        shell: bash
        env:
          WMM_KEYSTORE_B64: ${{ secrets.WMM_KEYSTORE_B64 }}
          WMM_KEYSTORE_PASSWORD: ${{ secrets.WMM_KEYSTORE_PASSWORD }}
          WMM_KEY_ALIAS: ${{ secrets.WMM_KEY_ALIAS }}
          WMM_KEY_PASSWORD: ${{ secrets.WMM_KEY_PASSWORD }}
        run: |
          if [ -z "${WMM_KEYSTORE_B64:-}" ]; then
            echo "WMM_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Brak WMM_KEYSTORE_B64 - APK zostanie zbudowane, ale nie będzie publikowane jako aktualizacja OTA."
            exit 0
          fi
          echo "$WMM_KEYSTORE_B64" | base64 --decode > android/app/wmm-release.jks
          cat > android/key.properties <<EOF
          storePassword=$WMM_KEYSTORE_PASSWORD
          keyPassword=$WMM_KEY_PASSWORD
          keyAlias=$WMM_KEY_ALIAS
          storeFile=wmm-release.jks
          EOF
          python scripts/configure_release_signing.py
          echo "WMM_STABLE_SIGNING=true" >> "$GITHUB_ENV"

      - name: Add secure storage and biometrics
        run: |
          flutter pub add flutter_secure_storage:9.2.4
          flutter pub add local_auth

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/main.dart test/widget_test.dart

      - name: Test
        run: flutter test test/widget_test.dart

      - name: Build release APK ARM64
        run: flutter build apk --release --target-platform android-arm64 --build-name 0.5.21 --build-number 71

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk WMM.apk

      - name: Show APK size
        run: ls -lh WMM.apk

      - name: Publish GitHub update release
        if: env.WMM_STABLE_SIGNING == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.5.21"
          TITLE="WMM 0.5.21"
          NOTES="WMM 0.5.21 poprawia dwie rzeczy w Maszynach. Zapisy z telefonu wymagają aktywnej sesji użytkownika, dzięki czemu historia przechowuje rzeczywisty login zamiast anonimowego autora WMM; opis zawiera też [WMM] login. Po QR przycisk Przegląd zaplanowany pokazuje wszystkie istniejące plany tej maszyny z WM: wpisy ręczne z reviews oraz terminy cykliczne z harmonogramu. Telefon nadal nie tworzy nowych planów. Wymaga aktualnego WM z gałęzi Rozwiniecie i ponownego uruchomienia WM."
          for attempt in 1 2 3; do
            echo "Publikacja release - próba $attempt/3"
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" WMM.apk --clobber; then
                exit 0
              fi
            else
              if gh release create "$TAG" WMM.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"; then
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "Nie udało się opublikować release po 3 próbach."
          exit 1

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WMM-apk
          path: WMM.apk
          if-no-files-found: error
